services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: courtside
      POSTGRES_PASSWORD: courtside
      POSTGRES_DB: courtside
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtside"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
